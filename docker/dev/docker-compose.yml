# Jellyfin + Maintainerr Development Test Environment
# ====================================================
#
# This docker-compose sets up a complete test environment with:
#   - Jellyfin media server
#   - Maintainerr (built from any branch)
#   - Sample media library structure
#
# Quick Start:
#   cd jellyfin-dev-documents/docker
#   docker compose up -d
#
# Build from a specific branch:
#   BRANCH=jellyfin-phase-e docker compose up -d --build
#   BRANCH=main docker compose up -d --build
#
# Build from a fork:
#   REPO=https://github.com/yourfork/Maintainerr.git BRANCH=my-feature docker compose up -d --build
#
# Access:
#   - Maintainerr: http://localhost:6246
#   - Jellyfin:    http://localhost:8096
#
# First-time Jellyfin setup:
#   1. Open http://localhost:8096
#   2. Complete the setup wizard, create admin user
#   3. Add media libraries: Movies=/media/movies, Shows=/media/tvshows
#   4. Get API key: Dashboard -> API Keys -> Add
#
# Configure Maintainerr to use Jellyfin:
#   1. Open http://localhost:6246
#   2. Settings -> Media Server -> Select "Jellyfin"
#   3. URL: http://jellyfin:8096 (internal docker network)
#   4. API Key: (from step 4 above)

version: "3.8"

services:
  # ==========================================
  # Maintainerr - Built from specified branch
  # ==========================================
  maintainerr:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BRANCH: ${BRANCH:-jellyfin-phase-e}
        REPO: ${REPO:-https://github.com/Maintainerr/Maintainerr.git}
    container_name: maintainerr-test
    ports:
      - "6246:6246"
    volumes:
      # Persistent data directory
      - ./maintainerr-data:/opt/data
    environment:
      - TZ=UTC
      - DEBUG=true
    restart: unless-stopped
    depends_on:
      - jellyfin
    networks:
      - maintainerr-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6246/api/app/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # Jellyfin Media Server
  # ==========================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: maintainerr-jellyfin-test
    # Use host user to avoid permission issues
    user: "1000:1000"
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - ./media/movies:/media/movies:ro
      - ./media/tvshows:/media/tvshows:ro
    environment:
      - TZ=UTC
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    restart: unless-stopped
    networks:
      - maintainerr-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # Media Generator - Creates sample media structure
  # ==========================================
  media-generator:
    image: alpine:latest
    container_name: maintainerr-media-generator
    volumes:
      - ./media:/media
    entrypoint: /bin/sh
    command: |
      -c '
      echo "Creating sample media directory structure..."
      
      # Create movie directories
      mkdir -p /media/movies/The\ Matrix\ \(1999\)
      mkdir -p /media/movies/Inception\ \(2010\)
      mkdir -p /media/movies/Interstellar\ \(2014\)
      mkdir -p /media/movies/The\ Dark\ Knight\ \(2008\)
      mkdir -p /media/movies/Pulp\ Fiction\ \(1994\)
      
      # Create TV show directories
      mkdir -p /media/tvshows/Breaking\ Bad/Season\ 01
      mkdir -p /media/tvshows/Breaking\ Bad/Season\ 02
      mkdir -p /media/tvshows/Breaking\ Bad/Season\ 03
      mkdir -p /media/tvshows/The\ Office/Season\ 01
      mkdir -p /media/tvshows/The\ Office/Season\ 02
      mkdir -p /media/tvshows/Stranger\ Things/Season\ 01
      
      # Create placeholder movie files
      touch /media/movies/The\ Matrix\ \(1999\)/The\ Matrix\ \(1999\).mkv
      touch /media/movies/Inception\ \(2010\)/Inception\ \(2010\).mkv
      touch /media/movies/Interstellar\ \(2014\)/Interstellar\ \(2014\).mkv
      touch /media/movies/The\ Dark\ Knight\ \(2008\)/The\ Dark\ Knight\ \(2008\).mkv
      touch /media/movies/Pulp\ Fiction\ \(1994\)/Pulp\ Fiction\ \(1994\).mkv
      
      # Create placeholder TV show files
      for ep in 01 02 03 04 05 06 07; do
        touch /media/tvshows/Breaking\ Bad/Season\ 01/S01E${ep}.mkv
        touch /media/tvshows/Breaking\ Bad/Season\ 02/S02E${ep}.mkv
      done
      for ep in 01 02 03 04 05 06; do
        touch /media/tvshows/The\ Office/Season\ 01/S01E${ep}.mkv
        touch /media/tvshows/Stranger\ Things/Season\ 01/S01E${ep}.mkv
      done
      
      echo "Sample media structure created!"
      echo ""
      echo "Movies:"
      ls -la /media/movies/
      echo ""
      echo "TV Shows:"
      find /media/tvshows -type f -name "*.mkv" | wc -l
      echo "episodes created"
      '
    networks:
      - maintainerr-test

networks:
  maintainerr-test:
    driver: bridge
